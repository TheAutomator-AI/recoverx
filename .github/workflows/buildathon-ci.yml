name: RecoverX Buildathon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Build web
        id: web_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build --prefix apps/web 2>&1 | tee web-build.log
      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log-${{ github.sha }}
          path: web-build.log
          if-no-files-found: error
      - name: Fail when web build fails
        if: steps.web_build.outcome == 'failure'
        run: exit 1

  python-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
